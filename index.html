<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор зарплаты учителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --accent:#2b6cb0;
    --accent-dark:#1e4e8c;
    --text:#1a202c;
    --muted:#4a5568;
    --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Geist', 'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:32px;
    width:100%;
    max-width:420px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  h1{
    font-size:20px;
    margin:0 0 6px;
  }
  .logo{
    margin-bottom:20px;
  }
  .logo svg{
    height:24px;
    width:auto;
    display:block;
  }
  p.sub{
    margin:0 0 24px;
    color:var(--muted);
    font-size:14px;
  }
  label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }
  input[type="number"]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:16px;
    margin-bottom:16px;
  }
  input[type="number"]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .results{
    margin-top:8px;
    border-top:1px solid var(--border);
    padding-top:20px;
  }
  .result-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:10px 0;
  }
  .result-label{
    font-size:14px;
    color:var(--muted);
  }
  .result-value{
    font-size:20px;
    font-weight:700;
  }
  .result-value.primary{ color:var(--accent-dark); }
  .result-formula{
    font-size:12px;
    color:#a0aec0;
    margin-top:-6px;
    margin-bottom:6px;
  }
  .note{
    margin-top:20px;
    font-size:12px;
    color:#a0aec0;
    line-height:1.5;
  }
</style>
</head>

    <h1>Калькулятор</h1>
    <p class="sub"></p>

    <label for="hours">Часы работы</label>
    <input type="number" id="hours" min="0" step="0.5" placeholder="Например, 20" oninput="calculate()">

    <label for="rate">Ставка за час</label>
    <input type="number" id="rate" min="0" step="1" value="200" oninput="calculate()">

    <label for="commission">Комиссия Vekta</label>
    <input type="number" id="commission" min="0" step="1" value="50" oninput="calculate()">

    <div class="results">
      <div class="result-item">
      <div class="result-item">
        <span class="result-label">Заработная плата</span>
        <span class="result-value" id="result-final">0</span>
      </div>
        <span class="result-label">Всего</span>
        <span class="result-value primary" id="result-s">0</span>
      </div>
      <div class="result-item">
        <span class="result-label">Комиссия</span>
        <span class="result-value" id="result-v">0</span>
      </div>
      <div class="result-item">
        <span class="result-label">Доход фаундера</span>
        <span class="result-value" id="result-founder">0</span>
      </div>
    </div>
  </div>

<script>
  function calculate() {
    const hoursInput = document.getElementById('hours').value;
    const x = parseFloat(hoursInput) || 0;
    const rateInput = document.getElementById('rate').value;
    const rate = parseFloat(rateInput) || 0;
    const commissionInput = document.getElementById('commission').value;
    const commission = parseFloat(commissionInput) || 0;
    const s = x * rate;
    const final = s - x * commission;
    const v = s - final;
    const founder = v / 2;

    document.getElementById('result-s').textContent = s.toLocaleString('ru-RU');
    document.getElementById('result-final').textContent = final.toLocaleString('ru-RU');
    document.getElementById('result-v').textContent = v.toLocaleString('ru-RU');
    document.getElementById('result-founder').textContent = founder.toLocaleString('ru-RU');
  }

  calculate();
</script>
</body>
</html>
